services:
  - type: web
    name: agenda-demo-api
    runtime: python
    plan: free
    region: virginia
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py bootstrap_superadmin && gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 60 --access-logfile - --bind 0.0.0.0:$PORT
    healthCheckPath: /admin/login/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://agenda-demo-api.onrender.com,https://agenda-demo-panel.onrender.com
      - key: DJANGO_CORS_ORIGINS
        value: https://agenda-demo-panel.onrender.com
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.locmem.EmailBackend
      - key: DJANGO_TRUST_PROXY_HEADERS
        value: "true"
      - key: DJANGO_TRUSTED_PROXY_COUNT
        value: "1"
      - key: DJANGO_NUM_PROXIES
        value: "1"
      - key: AGENDA_USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agenda-demo-db
          property: connectionString
      - key: AGENDA_PUBLIC_BASE_URL
        value: https://agenda-demo-api.onrender.com
      - key: AGENDA_SERVE_MEDIA
        value: "true"
      - key: AGENDA_SUPERADMIN_EMAIL
        sync: false
      - key: AGENDA_SUPERADMIN_PASSWORD
        sync: false
      - key: AGENDA_SUPERADMIN_FIRST_NAME
        sync: false

  - type: web
    name: agenda-demo-panel
    runtime: static
    branch: master
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://agenda-demo-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: agenda-demo-db
    plan: free
    region: virginia
